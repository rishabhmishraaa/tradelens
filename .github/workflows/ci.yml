name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run at a time per branch; later F2 tests share one Neon test branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:bundle # F7.9: no API key or server-only AI code in the browser bundle
      - run: npm test
        env:
          # F1.6: Neon test branch, from a repository secret. GitHub masks it in logs.
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test # the build step above already ran
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
